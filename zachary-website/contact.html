<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <title>ZA Portfolio - Contact</title>
    </head>

    <!-- scripts are loaded here because some elements use them -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="contact.js"></script>

    <body>
        <iframe src="navbar.html" frameborder="0" scrolling="no" width="100%" height="30px"></iframe>
        <div id="green-bar">
            <h1 class="center-text">Contact</h1>
        </div>

        <h2>Fill out the form to send me a message!</h2>
        <h3>Include your email if you'd like a follow-up.</h3>

        <form onsubmit="email(event)" id = "contact-form">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br>
            <label for="subj">Subject:</label><br>
            <input type="text" id="subj" name="subj"><br>
            <label for="msg">Message:</label><br>
            <input id="msg" name="msg" class="large-input"><br><br>
            <input type="submit" value="Send">
        </form>
    </body>
</html>
